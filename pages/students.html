<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Preschool Management System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="font-size: 2rem; margin-bottom: 0.5rem;">
                    <i class="fas fa-graduation-cap" style="background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
                </div>
                <h2>Preschool Management</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
                <li><a href="students.html" class="active"><i class="fas fa-users"></i>Students</a></li>
                <li><a href="attendance.html"><i class="fas fa-clipboard-check"></i>Attendance</a></li>
                <li><a href="activities.html"><i class="fas fa-puzzle-piece"></i>Activities</a></li>
                <li><a href="messages.html"><i class="fas fa-envelope"></i>Messages</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i>Reports</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i>Settings</a></li>
            </ul>
        </div>
        
        <div class="main-content">
            <div class="header">
                <div class="user-info">
                    <button class="btn btn-secondary" id="mobile-menu-toggle" style="display: none; margin-right: 1rem;">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h3><i class="fas fa-users" style="margin-right: 0.5rem; color: var(--primary-color);"></i>Students Management</h3>
                </div>
                <button class="btn-logout">
                    <i class="fas fa-sign-out-alt" style="margin-right: 0.5rem;"></i>Logout
                </button>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><i class="fas fa-child" style="margin-right: 0.5rem; color: var(--primary-color);"></i>All Students</h2>
                    <button class="btn btn-primary" id="add-student-btn">
                        <i class="fas fa-plus" style="margin-right: 0.5rem;"></i>Add Student
                    </button>
                </div>
                <div class="table-container">
                    <table id="students-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Class</th>
                                <th>Parent</th>
                                <th>Enrollment Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Student data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Search and Filter -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Search & Filter</h2>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="search-student">Search by Name</label>
                        <input type="text" id="search-student" placeholder="Enter student name...">
                    </div>
                    <div class="form-group">
                        <label for="filter-class">Filter by Class</label>
                        <select id="filter-class">
                            <option value="">All Classes</option>
                            <option value="Toddlers">Toddlers</option>
                            <option value="Preschool">Preschool</option>
                            <option value="Kindergarten">Kindergarten</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filter-age">Filter by Age</label>
                        <select id="filter-age">
                            <option value="">All Ages</option>
                            <option value="2">2 years</option>
                            <option value="3">3 years</option>
                            <option value="4">4 years</option>
                            <option value="5">5 years</option>
                            <option value="6">6 years</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Student Modal -->
    <div class="modal" id="add-student-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Add New Student</h2>
            <form id="add-student-form">
                <div class="form-group">
                    <label for="student-name">Name</label>
                    <input type="text" id="student-name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-age">Age</label>
                        <input type="number" id="student-age" required min="2" max="6">
                    </div>
                    <div class="form-group">
                        <label for="student-class">Class</label>
                        <select id="student-class" required>
                            <option value="">Select Class</option>
                            <option value="Toddlers">Toddlers</option>
                            <option value="Preschool">Preschool</option>
                            <option value="Kindergarten">Kindergarten</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="parent-username">Parent Username</label>
                    <input type="text" id="parent-username" required>
                </div>
                <div class="form-group">
                    <label for="parent-name">Parent Name</label>
                    <input type="text" id="parent-name" required>
                </div>
                <div class="form-group">
                    <label for="student-notes">Notes</label>
                    <textarea id="student-notes" rows="3" placeholder="Any additional notes about the student..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Add Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-items">
            <a href="admin-dashboard.html" class="bottom-nav-item">
                <i class="fas fa-tachometer-alt bottom-nav-icon"></i>
                <span class="bottom-nav-label">Dashboard</span>
            </a>
            <a href="students.html" class="bottom-nav-item active">
                <i class="fas fa-users bottom-nav-icon"></i>
                <span class="bottom-nav-label">Students</span>
            </a>
            <a href="attendance.html" class="bottom-nav-item">
                <i class="fas fa-clipboard-check bottom-nav-icon"></i>
                <span class="bottom-nav-label">Attendance</span>
            </a>
            <a href="activities.html" class="bottom-nav-item">
                <i class="fas fa-puzzle-piece bottom-nav-icon"></i>
                <span class="bottom-nav-label">Activities</span>
            </a>
            <a href="messages.html" class="bottom-nav-item">
                <i class="fas fa-envelope bottom-nav-icon"></i>
                <span class="bottom-nav-label">Messages</span>
            </a>
        </div>
    </nav>

    <!-- Firebase SDK -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/database.js"></script>
    <script type="module" src="../js/students.js"></script>
</body>
</html>
