<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | KidTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('assets/images/login-background.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-blue-50 p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 py-6 px-8">
            <img src="assets/images/logo.svg" alt="KidTracker Logo" class="h-16 mx-auto">
        </div>
        
        <div class="p-8">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Forgot Password</h1>
            <p class="text-center text-gray-600 mb-8">Enter your email address and we'll send you a link to reset your password.</p>
            
            <form id="forgotPasswordForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div id="errorMessage" class="hidden text-red-600 text-sm font-medium p-2 bg-red-50 rounded-lg"></div>
                <div id="successMessage" class="hidden text-green-600 text-sm font-medium p-2 bg-green-50 rounded-lg"></div>
                
                <button type="submit" 
                    class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200">
                    Send Reset Link
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Reset messages
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            
            // Basic validation
            if (!email) {
                errorMessage.textContent = 'Please enter your email address';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            // Simulate API call to send reset link
            // In a real app, this would be a server request
            setTimeout(() => {
                successMessage.textContent = 'Password reset link has been sent to your email address';
                successMessage.classList.remove('hidden');
                
                // Clear the form
                document.getElementById('email').value = '';
            }, 1000);
        });
    </script>
</body>
</html>
