<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Management System - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <div style="font-size: 3rem; margin-bottom: 1rem;">
                    <i class="fas fa-graduation-cap" style="background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
                </div>
                <h1>Preschool Management</h1>
                <p style="color: var(--gray-500); margin-top: 0.5rem; font-size: var(--font-size-sm);">Smart Solutions for Early Education</p>
            </div>
            <div class="login-form">
                <h2>Welcome Back</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user" style="margin-right: 0.5rem;"></i>
                            Username
                        </label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock" style="margin-right: 0.5rem;"></i>
                            Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-full btn-lg">
                            <i class="fas fa-sign-in-alt" style="margin-right: 0.5rem;"></i>
                            Sign In
                        </button>
                    </div>
                    <div id="error-message" class="error-message"></div>
                </form>
                
                <div style="text-align: center; margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--gray-200);">
                    <p style="color: var(--gray-500); font-size: var(--font-size-sm);">
                        New parent? 
                        <a href="pages/parent-registration.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">
                            Create an account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
